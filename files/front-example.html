document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 HEADER -->\n  <header style=\"position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #E5EAF2;height:64px;display:flex;align-items:center;padding:0 32px;gap:36px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <div style=\"width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2B6BF0,#1247A8);display:flex;align-items:center;justify-content:center\">\n        <div style=\"width:15px;height:15px;border-radius:3px;border:2.5px solid #fff;transform:rotate(45deg)\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"line-height:1.05\">\n        <div style=\"font-weight:800;font-size:16px;letter-spacing:.3px\">РОСЭЛТОРГ<\u002Fdiv>\n        <div style=\"font-size:10px;color:#79839A;letter-spacing:.5px\">Кандидаты<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex;align-items:center;gap:26px;height:100%\">\n      <a style=\"font-size:14px;color:#79839A;text-decoration:none;display:flex;align-items:center;height:100%\">Поиск резюме<\u002Fa>\n      <a style=\"font-size:14px;color:#79839A;text-decoration:none;display:flex;align-items:center;height:100%\">Мои вакансии<\u002Fa>\n      <a style=\"font-size:14px;color:#14171F;font-weight:600;text-decoration:none;display:flex;align-items:center;height:100%;position:relative\">Центр компетенций\n        <span style=\"position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:3px 3px 0 0;background:#2B6BF0\"><\u002Fspan>\n      <\u002Fa>\n    <\u002Fnav>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:14px\">\n      <div style=\"display:flex;align-items:center;gap:7px;background:#F1F5FB;border:1px solid #E2E9F3;border-radius:999px;padding:5px 13px\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#2B6BF0\"><\u002Fspan>\n        <span style=\"font-size:13px;font-weight:700;color:#3A4658\">Испытание · День 1 / 3<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7FA9F2,#3B6FD4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px\">АК<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ HUB ============ -->\n  <sc-if value=\"{{ isHub }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"max-width:1180px;margin:0 auto;padding:30px 32px 64px\">\n    <div style=\"margin-bottom:22px\">\n      <h1 style=\"font-size:27px;font-weight:800;letter-spacing:-.5px\">Испытание кандидата — 3 рабочих дня<\u002Fh1>\n      <p style=\"font-size:14.5px;color:#79839A;margin-top:6px;max-width:760px;line-height:1.5\">Нелинейный симулятор работы специалиста по госзакупкам. К вам приходят задачи и тикеты, вы принимаете 10–15 решений за день. Каждый выбор ведёт к последствию и открывает ачивку, которую увидит работодатель.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- candidate strip -->\n    <div style=\"display:flex;align-items:center;gap:18px;background:#fff;border:1px solid #E5EAF2;border-radius:16px;padding:18px 22px;margin-bottom:24px\">\n      <div style=\"width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#2B6BF0,#1247A8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px\">АК<\u002Fdiv>\n      <div style=\"flex:1\">\n        <div style=\"font-size:17px;font-weight:700\">Анна Климова<\u002Fdiv>\n        <div style=\"font-size:13px;color:#79839A;margin-top:2px\">Претендует на позицию: <b style=\"color:#14171F;font-weight:600\">Специалист по госзакупкам · 44-ФЗ<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;padding:0 18px;border-left:1px solid #EEF2F8\">\n        <div style=\"font-size:22px;font-weight:800\">{{ earnedCount }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:#79839A\">ачивок собрано<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;padding:0 18px;border-left:1px solid #EEF2F8\">\n        <div style=\"font-size:22px;font-weight:800\">1<span style=\"color:#B9C2D2\"> / 3<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:11px;color:#79839A\">день открыт<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DAY TRACK -->\n    <h2 style=\"font-size:19px;font-weight:800;margin-bottom:14px\">Дни испытания<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px\">\n      <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <div style=\"position:relative;background:{{ d.cardBg }};border:1px solid {{ d.cardBorder }};border-radius:18px;padding:22px;opacity:{{ d.op }};overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n            <div style=\"width:44px;height:44px;border-radius:12px;background:{{ d.numBg }};display:flex;align-items:center;justify-content:center;color:{{ d.numFg }};font-weight:800;font-size:18px\">{{ d.n }}<\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;background:{{ d.tagBg }};color:{{ d.tagFg }}\">{{ d.level }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:800\">Грейд: {{ d.grade }}<\u002Fdiv>\n          <div style=\"font-size:13px;color:#79839A;margin-top:8px;line-height:1.5;min-height:58px\">{{ d.desc }}<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:#9AA3B4;margin:12px 0 16px\">{{ d.decisions }}<\u002Fdiv>\n          <button onclick=\"{{ d.action }}\" style=\"width:100%;cursor:{{ d.cursor }};font-family:inherit;font-size:14px;font-weight:700;padding:13px;border-radius:12px;border:{{ d.btnBorder }};background:{{ d.btnBg }};color:{{ d.btnFg }}\">{{ d.cta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:22px\">\n      <!-- how it works -->\n      <div>\n        <h2 style=\"font-size:19px;font-weight:800;margin-bottom:14px\">Как это работает<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;gap:14px;background:#fff;border:1px solid #E5EAF2;border-radius:14px;padding:16px 18px\">\n            <div style=\"width:40px;height:40px;flex:none;border-radius:11px;background:#EAF1FE;display:flex;align-items:center;justify-content:center;font-size:19px\">🎬<\u002Fdiv>\n            <div><div style=\"font-size:14.5px;font-weight:700\">Нелинейный сюжет<\u002Fdiv><div style=\"font-size:13px;color:#79839A;margin-top:3px;line-height:1.45\">Как в Detroit: каждое решение меняет ход дня и ведёт к одной из нескольких концовок.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:14px;background:#fff;border:1px solid #E5EAF2;border-radius:14px;padding:16px 18px\">\n            <div style=\"width:40px;height:40px;flex:none;border-radius:11px;background:#FFF3DF;display:flex;align-items:center;justify-content:center;font-size:19px\">🏆<\u002Fdiv>\n            <div><div style=\"font-size:14.5px;font-weight:700\">Ачивки → решение работодателя<\u002Fdiv><div style=\"font-size:13px;color:#79839A;margin-top:3px;line-height:1.45\">Каждый ключевой выбор формирует ачивку. Работодатель видит профиль кандидата и решает, брать ли его.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:14px;background:#fff;border:1px solid #E5EAF2;border-radius:14px;padding:16px 18px\">\n            <div style=\"width:40px;height:40px;flex:none;border-radius:11px;background:#E7F6EF;display:flex;align-items:center;justify-content:center;font-size:19px\">📈<\u002Fdiv>\n            <div><div style=\"font-size:14.5px;font-weight:700\">Грейд растёт по дням<\u002Fdiv><div style=\"font-size:13px;color:#79839A;margin-top:3px;line-height:1.45\">Прошёл день — открыл следующий грейд. Не прошёл — испытание окончено. Так система определяет уровень.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- achievements -->\n      <div>\n        <h2 style=\"font-size:19px;font-weight:800;margin-bottom:14px\">Профиль для работодателя<\u002Fh2>\n        <div style=\"background:#fff;border:1px solid #E5EAF2;border-radius:16px;padding:18px;min-height:220px\">\n          <sc-if value=\"{{ noEarned }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"text-align:center;color:#9AA3B4;font-size:13.5px;padding:40px 10px;line-height:1.6\">Здесь появятся ачивки кандидата<br>после прохождения дня.<br><span style=\"color:#C2CAD8\">Начните День 1 →<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ earnedList }}\" as=\"a\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;align-items:center;gap:12px;border:1px solid {{ a.border }};background:{{ a.bg }};border-radius:12px;padding:11px 13px\">\n                <div style=\"width:34px;height:34px;flex:none;border-radius:9px;background:{{ a.iconBg }};display:flex;align-items:center;justify-content:center;font-size:17px\">{{ a.icon }}<\u002Fdiv>\n                <div style=\"flex:1\"><div style=\"font-size:13.5px;font-weight:700\">{{ a.title }}<\u002Fdiv><div style=\"font-size:12px;color:{{ a.noteColor }};margin-top:1px\">{{ a.note }}<\u002Fdiv><\u002Fdiv>\n                <span style=\"font-size:11px;font-weight:700;color:{{ a.tagFg }}\">{{ a.tag }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ SCENE ============ -->\n  <sc-if value=\"{{ isScene }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1080px;margin:0 auto;padding:22px 32px 50px\">\n    <!-- mini topbar -->\n    <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px\">\n      <button onclick=\"{{ backToHub }}\" style=\"cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#79839A;background:#fff;border:1px solid #E5EAF2;border-radius:9px;padding:8px 14px\">← Выйти из дня<\u002Fbutton>\n      <div style=\"font-size:13px;color:#79839A\">День 1 · <b style=\"color:#14171F\">Стажёр<\u002Fb> · решение <b style=\"color:#2B6BF0\">{{ decisions }}<\u002Fb> из ~12<\u002Fdiv>\n      <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-size:12px;color:#79839A\">Напряжение<\u002Fspan>\n        <div style=\"width:120px;height:8px;border-radius:999px;background:#E2E8F1;overflow:hidden\"><div style=\"height:100%;border-radius:999px;width:{{ tensionW }};background:{{ tensionColor }};transition:width .5s,background .5s\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- cinematic card -->\n    <div style=\"position:relative;background:radial-gradient(125% 95% at 50% -5%,#16294A 0%,#0B1828 52%,#05090F 100%);border:1px solid #1B2A45;border-radius:22px;overflow:hidden;min-height:460px;display:flex;flex-direction:column;padding:24px 30px\">\n      <div style=\"position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:140px;font-weight:500;color:rgba(255,255,255,.025);letter-spacing:8px\">44-ФЗ<\u002Fspan><\u002Fdiv>\n\n      <!-- setting slate -->\n      <div style=\"display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2\">\n        <div style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 13px\">\n          <span style=\"width:8px;height:8px;border-radius:2px;background:#E0483B\"><\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1.5px;color:#9FB2CC\">{{ setting }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isEnding }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:1px;padding:6px 14px;border-radius:999px;background:{{ verdictBg }};color:{{ verdictFg }}\">{{ verdictTag }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- dialogue -->\n      <div style=\"position:relative;z-index:2;width:100%;max-width:820px;flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0\">\n        <sc-for list=\"{{ lines }}\" as=\"l\" hint-placeholder-count=\"2\">\n          <div style=\"{{ l.wrap }}\">\n            <sc-if value=\"{{ l.isChar }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"{{ l.avatar }}\">{{ l.initial }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"{{ l.bubble }}\">\n              <sc-if value=\"{{ l.isChar }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"{{ l.nameStyle }}\">{{ l.name }}<span style=\"opacity:.6;font-weight:500\"> · {{ l.role }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"{{ l.textStyle }}\">{{ l.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- choices -->\n      <div style=\"position:relative;z-index:2;margin-top:22px;display:flex;flex-direction:column;gap:10px;max-width:600px\">\n        <sc-for list=\"{{ choices }}\" as=\"ch\" hint-placeholder-count=\"2\">\n          <button onclick=\"{{ ch.onClick }}\" style=\"display:flex;align-items:center;gap:14px;cursor:pointer;font-family:inherit;text-align:left;font-size:14.5px;font-weight:600;color:#E7EEF8;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:13px;padding:14px 18px;transition:all .16s\" style-hover=\"background:rgba(43,107,240,.22);border-color:#3F86FF;transform:translateX(4px)\">\n            <span style=\"width:4px;height:22px;border-radius:3px;background:#3F86FF;flex:none\"><\u002Fspan>\n            <span style=\"flex:1\">{{ ch.text }}<\u002Fspan>\n            <span style=\"opacity:.45;font-size:18px\">›<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- achievement toast -->\n      <sc-if value=\"{{ toastShow }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;background:rgba(12,22,38,.92);border:1px solid {{ toast.border }};border-radius:14px;padding:12px 18px;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:popIn .3s ease\">\n          <div style=\"width:38px;height:38px;border-radius:10px;background:{{ toast.iconBg }};display:flex;align-items:center;justify-content:center;font-size:19px\">{{ toast.icon }}<\u002Fdiv>\n          <div><div style=\"font-size:11px;letter-spacing:1px;color:#8FA3BE;font-weight:700\">{{ toast.kicker }}<\u002Fdiv><div style=\"font-size:14px;font-weight:700;color:#fff\">{{ toast.title }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ TREE ============ -->\n  <sc-if value=\"{{ isTree }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1180px;margin:0 auto;padding:24px 32px 64px\">\n    <!-- flowchart card -->\n    <div style=\"position:relative;background:linear-gradient(160deg,#0C1726,#060B14);border:1px solid #18243A;border-radius:22px;padding:24px 26px 20px;overflow:hidden;margin-bottom:24px\">\n      <div style=\"position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:118px;font-weight:500;color:rgba(255,255,255,.022);letter-spacing:10px\">ДЕНЬ 01<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;margin-bottom:8px\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#7E93B0\">ДЕРЕВО РЕШЕНИЙ · ДЕНЬ 1 — СТАЖЁР<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800;color:#fff;margin-top:5px\">{{ endingTitle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right\">\n          <div style=\"font-size:13px;color:#8FA3BE\">Принято решений<\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:800;color:#fff\">{{ decisions }}<span style=\"color:#46587A;font-size:15px\"> / {{ totalNodes }} узлов<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <svg viewBox=\"0 0 1180 480\" style=\"width:100%;height:auto;position:relative;z-index:2;display:block\">\n        <sc-for list=\"{{ treeEdges }}\" as=\"e\" hint-placeholder-count=\"20\">\n          <path d=\"{{ e.d }}\" fill=\"none\" stroke=\"{{ e.stroke }}\" stroke-width=\"{{ e.sw }}\"><\u002Fpath>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ treeNodes }}\" as=\"n\" hint-placeholder-count=\"15\">\n          <g>\n            <rect x=\"{{ n.x }}\" y=\"{{ n.y }}\" width=\"{{ n.w }}\" height=\"{{ n.h }}\" rx=\"8\" fill=\"{{ n.fill }}\" stroke=\"{{ n.stroke }}\" stroke-width=\"1.4\"><\u002Frect>\n            <text x=\"{{ n.cx }}\" y=\"{{ n.cy }}\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"Onest,sans-serif\" font-size=\"10.5\" font-weight=\"700\" fill=\"{{ n.tf }}\">{{ n.label }}<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsc-for>\n      <\u002Fsvg>\n      <div style=\"display:flex;gap:20px;position:relative;z-index:2;margin-top:6px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)\">\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#9FB2CC\"><span style=\"width:13px;height:13px;border-radius:3px;background:#2B6BF0\"><\u002Fspan>Ваш путь<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#9FB2CC\"><span style=\"width:13px;height:13px;border-radius:3px;background:#1E9E5A\"><\u002Fspan>Удачная концовка<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#9FB2CC\"><span style=\"width:13px;height:13px;border-radius:3px;background:#C8443A\"><\u002Fspan>Провал<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:#9FB2CC\"><span style=\"width:13px;height:13px;border-radius:3px;background:rgba(255,255,255,.12)\"><\u002Fspan>Не выбрано<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- verdict + achievements -->\n    <div style=\"display:grid;grid-template-columns:1fr 1.25fr;gap:22px\">\n      <div>\n        <div style=\"background:{{ vCardBg }};border:1px solid {{ vCardBorder }};border-radius:18px;padding:24px;color:{{ vCardFg }}\">\n          <div style=\"font-size:38px\">{{ vIcon }}<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.5px;margin-top:10px;opacity:.85;text-transform:uppercase\">{{ verdictTag }}<\u002Fdiv>\n          <div style=\"font-size:21px;font-weight:800;margin-top:6px;line-height:1.25\">{{ verdictHead }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;margin-top:8px;line-height:1.5;opacity:.9\">{{ verdictText }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:14px\">\n          <button onclick=\"{{ d2action }}\" style=\"cursor:{{ d2cursor }};font-family:inherit;font-size:14px;font-weight:700;padding:14px;border-radius:12px;border:none;background:{{ d2bg }};color:{{ d2fg }}\">{{ d2cta }}<\u002Fbutton>\n          <button onclick=\"{{ startDay }}\" style=\"cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;padding:13px;border-radius:12px;border:1px solid #D3E2FC;background:#fff;color:#1A5BD6\">Сыграть день заново<\u002Fbutton>\n          <button onclick=\"{{ backToHub }}\" style=\"cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;padding:11px;border-radius:12px;border:none;background:transparent;color:#79839A\">Вернуться в профиль<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px\">\n          <h2 style=\"font-size:18px;font-weight:800\">Что узнал работодатель<\u002Fh2>\n          <span style=\"font-size:12.5px;color:#79839A\">{{ earnedCount }} ачивок за день<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ earnedList }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:13px;border:1px solid {{ a.border }};background:{{ a.bg }};border-radius:13px;padding:13px 15px;animation:fadeUp .35s ease\">\n              <div style=\"width:40px;height:40px;flex:none;border-radius:11px;background:{{ a.iconBg }};display:flex;align-items:center;justify-content:center;font-size:20px\">{{ a.icon }}<\u002Fdiv>\n              <div style=\"flex:1\"><div style=\"font-size:14px;font-weight:700\">{{ a.title }}<\u002Fdiv><div style=\"font-size:12.5px;color:{{ a.noteColor }};margin-top:2px\">Заказчик учтёт: {{ a.note }}<\u002Fdiv><\u002Fdiv>\n              <span style=\"font-size:11px;font-weight:800;color:{{ a.tagFg }};white-space:nowrap\">{{ a.tag }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CHARS = {\n  gromov: { name: 'Громов А.П.', role: 'Начальник отдела', color: '#C8443A', initial: 'Г' },\n  oleg:   { name: 'Олег',        role: 'Коллега',          color: '#6B7A90', initial: 'О' },\n  buh:    { name: 'Нина Сергеевна', role: 'Главбух',       color: '#B07BD0', initial: 'Н' },\n  you:    { name: 'Вы',          role: 'Стажёр',           color: '#2B6BF0', initial: 'Я' },\n};\n\nconst ACH = {\n  smoke:    { icon: '🚬', title: 'Любит перекуры',          type: 'neg', note: 'уходит с поста в рабочее время' },\n  conflict: { icon: '🥊', title: 'Не боится конфликта',     type: 'pos', note: 'готов отстаивать позицию' },\n  team:     { icon: '🤝', title: 'Командный игрок',          type: 'pos', note: 'поддерживает коллег' },\n  questions:{ icon: '❓', title: 'Задаёт верные вопросы',    type: 'pos', note: 'уточняет вводные до старта' },\n  nmck:     { icon: '📊', title: 'Знает методику НМЦК',      type: 'pos', note: 'метод сопоставимых рыночных цен' },\n  fz33:     { icon: '📑', title: 'Соблюдает 44-ФЗ',          type: 'pos', note: 'помнит про «или эквивалент», ст. 33' },\n  method:   { icon: '⚖️', title: 'Верный способ закупки',    type: 'pos', note: 'корректно выбирает процедуру' },\n  stress:   { icon: '🧊', title: 'Стрессоустойчивый',        type: 'pos', note: 'держит лицо под давлением' },\n  fas:      { icon: '⚠️', title: 'Риск жалобы в ФАС',        type: 'neg', note: 'допустил нарушение в документации' },\n  flawless: { icon: '🏆', title: 'Безупречный старт',        type: 'pos', note: 'прошёл день без единой ошибки' },\n};\n\nconst C = (who, text) => ({ who, text });\nconst N = t => ({ who: 'narr', text: t });\n\nconst GRAPH = {\n  start: { tree: true, setting: 'ОТДЕЛ ЗАКУПОК · ПН, 9:02', lines: [\n      N('Ваш первый день. Вы ещё не дошли до своего стола, как отдел вздрагивает от крика.'),\n      C('gromov', 'Олег! Ты сорвал сроки публикации извещения! Контракт ушёл другому! Ещё раз — и пиши заявление!'),\n      N('Олег молчит, уставившись в монитор. Коллеги делают вид, что заняты. Вы понимаете: Громов умеет давить.') ],\n    choices: [\n      { text: 'Молча пройти к своему столу', to: 'task', tension: 12 },\n      { text: 'Вступиться за Олега перед начальником', to: 'task', ach: 'conflict', tension: 20 },\n      { text: 'Тихо шепнуть Олегу: «Держись, потом помогу разобраться»', to: 'task', ach: 'team', tension: 12 } ] },\n\n  task: { tree: true, setting: 'ВАШ РАБОЧИЙ СТОЛ · 9:15', lines: [\n      C('gromov', 'Так, новенький. Бухгалтерии нужно 30 ноутбуков. Бюджет выделен. К обеду жду план закупки. Время пошло.') ],\n    choices: [\n      { text: 'Уточнить бюджет, сроки и требования', to: 'clarify', ach: 'questions' },\n      { text: 'Сразу пойти анализировать рынок', to: 'research' },\n      { text: 'Выйти покурить и обдумать на свежем воздухе', to: 'smoke', ach: 'smoke' } ] },\n\n  clarify: { tree: true, setting: 'У СТОЛА НАЧАЛЬНИКА · 9:18', lines: [\n      C('you', 'Александр Петрович, какой бюджет и срок? Есть особые требования к технике?'),\n      C('gromov', '4 200 000. Поставка за 30 дней. И без приключений с ФАС, понял?'),\n      N('Теперь у вас есть рамки. Это сэкономит часы работы.') ],\n    choices: [ { text: 'Перейти к анализу рынка', to: 'research' } ] },\n\n  research: { tree: true, setting: 'АНАЛИЗ РЫНКА · 9:40', lines: [\n      N('Чтобы объявить закупку, нужно обосновать НМЦК — начальную (максимальную) цену контракта. От этого зависит всё.') ],\n    choices: [\n      { text: 'Запросить 3 коммерческих предложения у поставщиков', to: 'nmck_ok', ach: 'nmck' },\n      { text: 'Взять первую попавшуюся цену из интернета', to: 'nmck_bad', mistake: true },\n      { text: 'Просто скопировать НМЦК из прошлогодней закупки', to: 'nmck_bad', mistake: true } ] },\n\n  nmck_ok: { tree: true, setting: 'РАСЧЁТ НМЦК · 10:10', lines: [\n      N('Поставщики прислали КП: 138 000, 142 000 и 145 000 ₽ за единицу. Метод сопоставимых рыночных цен — НМЦК обоснована и защищена.') ],\n    choices: [ { text: 'Перейти к составлению ТЗ', to: 'spec' } ] },\n\n  nmck_bad: { tree: true, setting: 'РАСЧЁТ НМЦК · 10:10', lines: [\n      N('Вы поставили цену «на глаз» — 180 000 ₽ за ноутбук. Обоснования нет, цена завышена. Это слабое место всей закупки.') ],\n    choices: [ { text: 'Перейти к составлению ТЗ', to: 'spec' } ] },\n\n  spec: { tree: false, setting: 'СОСТАВЛЕНИЕ ТЗ · 10:40', lines: [\n      C('buh', 'Пиши конкретно: ноутбуки Apple MacBook. Нам нужны только они, без всяких вариантов.'),\n      N('Главбух смотрит выжидающе. Но вы помните про закон о защите конкуренции.') ],\n    choices: [\n      { text: 'Описать характеристики и добавить «или эквивалент»', to: 'spec_ok', ach: 'fz33' },\n      { text: 'Написать «Apple MacBook» без эквивалента, как просит главбух', to: 'spec_bad', critical: true, ach: 'fas' } ] },\n\n  spec_ok: { tree: true, setting: 'ТЕХЗАДАНИЕ ГОТОВО · 11:00', lines: [\n      N('ТЗ описывает потребность через характеристики и «или эквивалент». Конкуренция сохранена — претензий не будет.') ],\n    choices: [ { text: 'Выбрать способ закупки', to: 'method' } ] },\n\n  spec_bad: { tree: true, setting: 'ТЕХЗАДАНИЕ ГОТОВО · 11:00', lines: [\n      N('В ТЗ зашит конкретный бренд без «или эквивалент». Формально — ограничение конкуренции. Бомба замедленного действия.') ],\n    choices: [ { text: 'Выбрать способ закупки', to: 'method' } ] },\n\n  method: { tree: false, setting: 'СПОСОБ ЗАКУПКИ · 11:10', lines: [\n      N('Сумма — 4,2 млн ₽. Нужно выбрать способ определения поставщика по 44-ФЗ.') ],\n    choices: [\n      { text: 'Электронный аукцион', to: 'method_ok', ach: 'method' },\n      { text: 'Закупка у единственного поставщика', to: 'method_bad', mistake: true },\n      { text: 'Запрос котировок', to: 'method_bad', mistake: true } ] },\n\n  method_ok: { tree: true, setting: 'ПЛАН СОБРАН · 11:30', lines: [\n      N('Электронный аукцион — корректный выбор для такой суммы и типового товара.') ],\n    choices: [ { text: 'Идти к Громову с готовым планом', to: 'submit' } ] },\n\n  method_bad: { tree: true, setting: 'ПЛАН СОБРАН · 11:30', lines: [\n      N('Выбранный способ не подходит под сумму закупки — это нарушение порядка определения поставщика.') ],\n    choices: [ { text: 'Идти к Громову с готовым планом', to: 'submit' } ] },\n\n  submit: { tree: true, setting: 'КАБИНЕТ ГРОМОВА · 12:00', lines: [\n      C('gromov', 'Ну? Показывай, что наработал. Только быстро — у меня совещание через пять минут.'),\n      N('Он постукивает ручкой по столу и смотрит на часы. Давит.') ],\n    choices: [\n      { text: 'Спокойно и по делу представить план', to: 'RESOLVE', ach: 'stress', tension: 10 },\n      { text: 'Сбивчиво, но честно изложить как есть', to: 'RESOLVE', tension: 14 },\n      { text: 'Сказать, что нужно ещё пара часов', to: 'RESOLVE', tension: 10 } ] },\n\n  smoke: { tree: true, ending: true, verdict: 'fail', title: 'Уволен за прогул', setting: 'КУРИЛКА · 9:25', lines: [\n      N('Вы выходите «на пять минут». Возвращаетесь через сорок. У вашего стола стоит Громов с вашими вещами в коробке.'),\n      C('gromov', 'У нас тут работают, а не отдыхают. Свободен.') ],\n    choices: [ { text: 'Открыть дерево решений →', to: 'TREE' } ] },\n\n  end_strong: { tree: true, ending: true, verdict: 'pass', grantAch: 'flawless', title: 'Безупречный старт', setting: 'ИТОГ ДНЯ · 12:10', lines: [\n      C('gromov', 'Хм. Чисто. НМЦК обоснована, ТЗ без подвохов, способ верный. Для новичка — прилично. Завтра в 9:00, не опаздывай.'),\n      N('Вы прошли первый день безупречно. Грейд «Стажёр» подтверждён. Открыт День 2 — уровень «Мидл».') ],\n    choices: [ { text: 'Открыть дерево решений →', to: 'TREE' } ] },\n\n  end_ok: { tree: true, ending: true, verdict: 'pass', title: 'Прошёл с замечаниями', setting: 'ИТОГ ДНЯ · 12:10', lines: [\n      C('gromov', 'План рабочий, но огрехи есть. В следующий раз — аккуратнее. Считай, день зачтён.'),\n      N('Вы прошли день, но заказчик отметил недочёты. Грейд «Стажёр» подтверждён условно.') ],\n    choices: [ { text: 'Открыть дерево решений →', to: 'TREE' } ] },\n\n  end_fas: { tree: true, ending: true, verdict: 'fail', grantAch: 'fas', title: 'Жалоба в ФАС', setting: 'НЕДЕЛЮ СПУСТЯ', lines: [\n      N('Поставщик подал жалобу: в ТЗ указан бренд без «или эквивалент». ФАС выдала предписание, штраф по КоАП 7.30 — 50 000 ₽.'),\n      C('gromov', 'Ты подставил весь отдел в первый же день. Нам такие не нужны. Свободен.') ],\n    choices: [ { text: 'Открыть дерево решений →', to: 'TREE' } ] },\n};\n\nconst TPOS = { start:[0,2], task:[1,2], clarify:[2,0], research:[2,2], smoke:[2,5], nmck_ok:[3,1], nmck_bad:[3,3], spec_ok:[4,1], spec_bad:[4,3], method_ok:[5,1], method_bad:[5,3], submit:[6,2], end_strong:[7,0], end_ok:[7,2], end_fas:[7,4] };\nconst TLABEL = { start:'Первый день', task:'Задание', clarify:'Уточнил вводные', research:'Анализ рынка', smoke:'Уволен за прогул', nmck_ok:'НМЦК: 3 КП', nmck_bad:'НМЦК «на глаз»', spec_ok:'ТЗ: эквивалент', spec_bad:'ТЗ под бренд', method_ok:'Аукцион', method_bad:'Неверный способ', submit:'Защита плана', end_strong:'Идеальный старт', end_ok:'С замечаниями', end_fas:'Жалоба в ФАС' };\nconst TKIND = { nmck_bad:'warn', spec_bad:'warn', method_bad:'warn', end_strong:'good', end_ok:'good', end_fas:'bad', smoke:'bad' };\nconst EDGES = [['start','task'],['task','clarify'],['task','research'],['task','smoke'],['clarify','research'],['research','nmck_ok'],['research','nmck_bad'],['nmck_ok','spec_ok'],['nmck_ok','spec_bad'],['nmck_bad','spec_ok'],['nmck_bad','spec_bad'],['spec_ok','method_ok'],['spec_ok','method_bad'],['spec_bad','method_ok'],['spec_bad','method_bad'],['method_ok','submit'],['method_bad','submit'],['submit','end_strong'],['submit','end_ok'],['submit','end_fas']];\n\nclass Component extends DCLogic {\n  state = { screen: 'hub', node: 'start', path: ['start'], earned: [], mistakes: 0, critical: false, decisions: 0, tension: 0, toast: null };\n\n  startDay = () => this.setState({ screen: 'scene', node: 'start', path: ['start'], earned: [], mistakes: 0, critical: false, decisions: 0, tension: 8, toast: null });\n  backToHub = () => this.setState({ screen: 'hub', toast: null });\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  choose(c) {\n    if (c.to === 'TREE') { this.setState({ screen: 'tree' }); return; }\n    const st = this.state;\n    let earned = [...st.earned], toast = null;\n    if (c.ach && !earned.includes(c.ach)) { earned.push(c.ach); toast = c.ach; }\n    const mistakes = st.mistakes + (c.mistake ? 1 : 0);\n    const critical = st.critical || !!c.critical;\n    let to = c.to;\n    if (to === 'RESOLVE') to = critical ? 'end_fas' : (mistakes === 0 ? 'end_strong' : 'end_ok');\n    const node = GRAPH[to];\n    if (node.grantAch && !earned.includes(node.grantAch)) { earned.push(node.grantAch); toast = node.grantAch; }\n    const path = node.tree ? [...st.path, to] : st.path;\n    const tension = Math.min(100, st.tension + (c.tension || 0));\n    this.setState({ node: to, earned, mistakes, critical, path, decisions: st.decisions + 1, tension, toast });\n    if (toast) { clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 2300); }\n  }\n\n  achCard(id, forEmployer) {\n    const a = ACH[id]; const pos = a.type === 'pos';\n    return { icon: a.icon, title: a.title, note: a.note,\n      bg: pos ? '#F2FBF6' : '#FCEFEC', border: pos ? '#D7EFE0' : '#F4D6CF',\n      iconBg: pos ? '#E0F5E9' : '#FBE0D9', noteColor: pos ? '#3C5A49' : '#9A5045',\n      tag: pos ? '+ плюс' : '− минус', tagFg: pos ? '#1E9E5A' : '#D4574A' };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const earnedList = s.earned.map(id => this.achCard(id, true));\n\n    // ---- days\n    const dayBtn = (active) => active\n      ? { btnBg: '#2B6BF0', btnFg: '#fff', btnBorder: 'none', cursor: 'pointer' }\n      : { btnBg: '#EEF2F8', btnFg: '#9AA3B4', btnBorder: '1px solid #E2E8F1', cursor: 'not-allowed' };\n    const days = [\n      { n: 1, grade: 'Стажёр', level: 'Джун', desc: 'Первый день. Знакомство с отделом, простая закупка, базовые развилки.', decisions: '10–13 решений', cta: 'Начать День 1', action: this.startDay,\n        cardBg: '#fff', cardBorder: '#D3E2FC', op: '1', numBg: '#2B6BF0', numFg: '#fff', tagBg: '#EAF1FE', tagFg: '#1A5BD6', ...dayBtn(true) },\n      { n: 2, grade: 'Специалист', level: 'Мидл', desc: 'Полный цикл закупки под давлением. Начальник кричит уже на вас — проверка стрессоустойчивости.', decisions: '12–15 решений', cta: 'Откроется после Дня 1', action: () => {},\n        cardBg: '#fff', cardBorder: '#E5EAF2', op: '.62', numBg: '#EEF2F8', numFg: '#9AA3B4', tagBg: '#F1F5FB', tagFg: '#9AA3B4', ...dayBtn(false) },\n      { n: 3, grade: 'Ведущий', level: 'Сеньор', desc: 'Жалоба в ФАС, расторжение контракта, РНП. Самые сложные и неоднозначные развилки.', decisions: '14–16 решений', cta: 'Финальный день', action: () => {},\n        cardBg: '#fff', cardBorder: '#E5EAF2', op: '.62', numBg: '#EEF2F8', numFg: '#9AA3B4', tagBg: '#F1F5FB', tagFg: '#9AA3B4', ...dayBtn(false) },\n    ];\n\n    // ---- scene\n    const node = GRAPH[s.node] || GRAPH.start;\n    const lines = (node.lines || []).map(l => {\n      if (l.who === 'narr') return { isChar: false, text: l.text,\n        wrap: 'display:block;margin-bottom:14px',\n        bubble: 'max-width:760px',\n        textStyle: \"font-size:15px;line-height:1.6;color:#9FB2CC;font-style:italic;border-left:2px solid rgba(255,255,255,.14);padding-left:14px\" };\n      const ch = CHARS[l.who]; const you = l.who === 'you';\n      return { isChar: true, text: l.text, initial: ch.initial, name: ch.name, role: ch.role,\n        wrap: 'display:flex;gap:13px;margin-bottom:14px;align-items:flex-start;' + (you ? 'flex-direction:row-reverse' : ''),\n        avatar: `width:42px;height:42px;flex:none;border-radius:11px;background:${ch.color};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px`,\n        bubble: 'max-width:640px;' + (you ? 'text-align:right' : ''),\n        nameStyle: `font-size:12px;font-weight:700;color:${you ? '#7FB0FF' : '#C8D6E8'};margin-bottom:5px`,\n        textStyle: `font-size:16px;line-height:1.55;color:#EAF1F9;background:${you ? 'rgba(43,107,240,.16)' : 'rgba(255,255,255,.05)'};border:1px solid ${you ? 'rgba(63,134,255,.3)' : 'rgba(255,255,255,.1)'};border-radius:14px;padding:12px 16px;display:inline-block;text-align:left` };\n    });\n    const choices = (node.choices || []).map(c => ({ text: c.text, onClick: () => this.choose(c) }));\n\n    const tcolor = s.tension >= 66 ? '#E0483B' : s.tension >= 33 ? '#E8930C' : '#2B6BF0';\n    const isEnding = !!node.ending;\n    const pass = node.verdict === 'pass';\n    const verdictTag = isEnding ? (pass ? 'ДЕНЬ ПРОЙДЕН' : 'ИСПЫТАНИЕ ПРОВАЛЕНО') : '';\n\n    const toastA = s.toast ? ACH[s.toast] : null;\n    const toast = toastA ? { icon: toastA.icon, title: toastA.title,\n      kicker: toastA.type === 'pos' ? 'АЧИВКА ПОЛУЧЕНА' : 'РАБОТОДАТЕЛЬ ЗАМЕТИЛ',\n      border: toastA.type === 'pos' ? 'rgba(63,134,255,.5)' : 'rgba(224,72,59,.5)',\n      iconBg: toastA.type === 'pos' ? 'rgba(43,107,240,.25)' : 'rgba(224,72,59,.22)' } : {};\n\n    // ---- tree drawing\n    const x = c => 24 + c * 144, y = r => 26 + r * 78;\n    const visited = new Set(s.path);\n    const treeNodes = Object.keys(TPOS).map(id => {\n      const [c, r] = TPOS[id]; const vx = x(c), vy = y(r); const vis = visited.has(id); const kind = TKIND[id] || 'norm';\n      let fill, stroke, tf;\n      if (!vis) { fill = 'rgba(255,255,255,.035)'; stroke = 'rgba(255,255,255,.16)'; tf = 'rgba(255,255,255,.42)'; }\n      else if (kind === 'good') { fill = 'rgba(30,158,90,.95)'; stroke = '#6FE3AC'; tf = '#fff'; }\n      else if (kind === 'bad') { fill = 'rgba(200,68,58,.95)'; stroke = '#FF9085'; tf = '#fff'; }\n      else if (kind === 'warn') { fill = 'rgba(232,147,12,.95)'; stroke = '#FFC468'; tf = '#231603'; }\n      else { fill = 'rgba(43,107,240,.95)'; stroke = '#86B4FF'; tf = '#fff'; }\n      return { id, x: vx, y: vy, w: 120, h: 40, cx: vx + 60, cy: vy + 21, fill, stroke, tf, label: TLABEL[id] };\n    });\n    const pairSet = new Set();\n    for (let i = 0; i < s.path.length - 1; i++) pairSet.add(s.path[i] + '>' + s.path[i + 1]);\n    const treeEdges = EDGES.map(([a, b]) => {\n      const A = TPOS[a], B = TPOS[b];\n      const x1 = x(A[0]) + 120, y1 = y(A[1]) + 20, x2 = x(B[0]), y2 = y(B[1]) + 20, midX = (x1 + x2) / 2;\n      const on = pairSet.has(a + '>' + b);\n      return { d: `M${x1} ${y1} H${midX} V${y2} H${x2}`, stroke: on ? '#2B6BF0' : 'rgba(255,255,255,.1)', sw: on ? 2.6 : 1.2 };\n    });\n\n    // verdict card\n    const endTitle = node.ending ? node.title : '';\n    const vCard = pass\n      ? { vCardBg: 'linear-gradient(150deg,#157A45,#0C5230)', vCardBorder: '#1E9E5A', vCardFg: '#fff', vIcon: '✅', verdictHead: 'Грейд подтверждён', verdictText: 'Кандидат прошёл День 1. Открыт День 2 — уровень «Мидл». Так система определяет реальный грейд специалиста.' }\n      : { vCardBg: 'linear-gradient(150deg,#9E2A22,#5E140F)', vCardBorder: '#C8443A', vCardFg: '#fff', vIcon: '🚫', verdictHead: 'Грейд не подтверждён', verdictText: 'Решение привело к провалу испытательного дня. Работодатель увидит причину в дереве решений и ачивках.' };\n    const d2 = pass\n      ? { d2bg: '#2B6BF0', d2fg: '#fff', d2cta: 'К Дню 2 (Мидл) — скоро', d2cursor: 'not-allowed', d2action: () => {} }\n      : { d2bg: '#2B6BF0', d2fg: '#fff', d2cta: 'Пройти день заново', d2cursor: 'pointer', d2action: this.startDay };\n\n    return {\n      isHub: s.screen === 'hub', isScene: s.screen === 'scene', isTree: s.screen === 'tree',\n      startDay: this.startDay, backToHub: this.backToHub,\n      earnedList, earnedCount: s.earned.length, noEarned: s.earned.length === 0, days,\n      setting: node.setting, lines, choices, decisions: s.decisions,\n      tensionW: s.tension + '%', tensionColor: tcolor,\n      isEnding, verdictTag, verdictBg: pass ? 'rgba(30,158,90,.95)' : 'rgba(200,68,58,.95)', verdictFg: '#fff',\n      toastShow: !!s.toast, toast,\n      treeNodes, treeEdges, totalNodes: Object.keys(TPOS).length,\n      endingTitle: endTitle, ...vCard, ...d2,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
